[package]
name = "seqdedupe"
version = "0.1.0"
edition = "2024"
authors = ["Maxim Vorobjov <m@decrypt.mozmail.com>"]
description = """
Lock-free deduplication of u64 sequence numbers for a fixed set of threads \
(A/B feed arbitration, redundant ingest, at-least-once consumers). \
Uses 64 and 128 bit CPU synchronization primitives to guarantee synchronousity, \
preallocated immutable bitmap slots, optimistic or hazard-pointer \
validation, AVX2/AVX-512 shifts, consistent snapshots with gap listing. \
x86-64 only. No other release dependencies."""
license = "MIT"
readme = "README.md"
keywords = ["lock-free", "deduplication", "sequence", "concurrency", "atomic"]
categories = ["concurrency", "data-structures"]

[dependencies]

[dev-dependencies]
core_affinity = "0.8"
hdrhistogram = { version = "7.5", default-features = false }
scc = "3.8"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"

[profile.bench]
inherits = "release"

[[bench]]
name = "register"
harness = false

[[bench]]
name = "latency"
harness = false
