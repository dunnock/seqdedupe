<g><title>2 threads: p99 = 70 ns</title><path d="M247.0,310.0 L247.0,247.5 Q247.0,243.5 251.0,243.5 L269.0,243.5 Q273.0,243.5 273.0,247.5 L273.0,310.0 Z" class="f-r2"/></g>
