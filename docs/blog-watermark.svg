<text class="ptitle" x="60" y="116">Saturated arbitration (every thread sees every id)</text>
<text class="ptitle" x="474.0" y="116">Live feed, 50k msg/s per stream</text>
<text class="sub" x="56" y="362">Saturated throughput: 270, 76 and 72 M ops/s (all threads) at 1, 2 and 4 threads.</text>
