<rect class="bg" width="760" height="380" rx="8"/>
<text class="title" x="56" y="30">Window::Latest with a plain load: time per register() call</text>
<text class="sub" x="56" y="50">ns per call on an EPYC 9845; lower is better. The cost grows with the number of cores sharing the line.</text>
