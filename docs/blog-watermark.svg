<g><title>4 streams: p99 = 70 ns</title><path d="M655.0,310.0 L655.0,247.5 Q655.0,243.5 659.0,243.5 L677.0,243.5 Q681.0,243.5 681.0,247.5 L681.0,310.0 Z" class="f-r2"/></g>
<g><title>4 streams: p99.9 = 100 ns</title><path d="M683.0,310.0 L683.0,219.0 Q683.0,215.0 687.0,215.0 L705.0,215.0 Q709.0,215.0 709.0,219.0 L709.0,310.0 Z" class="f-r3"/></g>
