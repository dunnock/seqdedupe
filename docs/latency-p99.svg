<text class="val" x="131.0" y="234.0" text-anchor="middle">70 ns</text>
<text class="tick" x="281.0" y="316" text-anchor="middle">Bits64</text>
<g><title>Bits64, 10k msg/s per stream: p99 = 60 ns</title><path d="M240.0,296.0 L240.0,252.0 Q240.0,248.0 244.0,248.0 L262.0,248.0 Q266.0,248.0 266.0,252.0 L266.0,296.0 Z" class="f-r1"/></g>
