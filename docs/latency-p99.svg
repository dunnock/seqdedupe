<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-label="p99 register() latency per deduper mode at each message rate">

<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; }
  .tick { font-size: 11px; font-variant-numeric: tabular-nums; }
  .ptitle { font-size: 12px; font-weight: 600; }
  .leg { font-size: 12px; }
  .val { font-size: 10px; font-variant-numeric: tabular-nums; }
  .grid, .axis { stroke-width: 1; }
  .bg{fill:#fcfcfb}
  .title{fill:#0b0b0b}
  .ptitle{fill:#0b0b0b}
  .sub,.leg,.val{fill:#52514e}
  .tick{fill:#898781}
  .grid{stroke:#e1e0d9}
  .axis{stroke:#c3c2b7}
  .k-surface{stroke:#fcfcfb}
  .f-s1{fill:#2a78d6} .k-s1{stroke:#2a78d6}
  .f-s2{fill:#eb6834} .k-s2{stroke:#eb6834}
  .f-s3{fill:#1baf7a} .k-s3{stroke:#1baf7a}
  .f-s4{fill:#eda100} .k-s4{stroke:#eda100}
  .f-s5{fill:#e87ba4} .k-s5{stroke:#e87ba4}
  .f-s6{fill:#008300} .k-s6{stroke:#008300}
  .f-r1{fill:#86b6ef} .k-r1{stroke:#86b6ef}
  .f-r2{fill:#2a78d6} .k-r2{stroke:#2a78d6}
  .f-r3{fill:#104281} .k-r3{stroke:#104281}
  @media (prefers-color-scheme: dark) {
  .bg{fill:#1a1a19}
  .title{fill:#f0efec}
  .ptitle{fill:#f0efec}
  .sub,.leg,.val{fill:#c3c2b7}
  .tick{fill:#898781}
  .grid{stroke:#2c2c2a}
  .axis{stroke:#383835}
  .k-surface{stroke:#1a1a19}
  .f-s1{fill:#3987e5} .k-s1{stroke:#3987e5}
  .f-s2{fill:#d95926} .k-s2{stroke:#d95926}
  .f-s3{fill:#199e70} .k-s3{stroke:#199e70}
  .f-s4{fill:#c98500} .k-s4{stroke:#c98500}
  .f-s5{fill:#d55181} .k-s5{stroke:#d55181}
  .f-s6{fill:#0ca30c} .k-s6{stroke:#0ca30c}
  .f-r1{fill:#184f95} .k-r1{stroke:#184f95}
  .f-r2{fill:#3987e5} .k-r2{stroke:#3987e5}
  .f-r3{fill:#86b6ef} .k-r3{stroke:#86b6ef}
  }
</style>

<rect class="bg" width="980" height="360" rx="8"/>
<text class="title" x="56" y="30">p99 register() latency per mode and rate</text>
<text class="sub" x="56" y="50">ns per call, 4 redundant streams; lower is better. Rate barely matters, the mode does.</text>
<rect x="56" y="68" width="12" height="12" rx="3" class="f-r1"/>
<text class="leg" x="74" y="78">10k msg/s per stream</text>
<rect x="242.0" y="68" width="12" height="12" rx="3" class="f-r2"/>
<text class="leg" x="260.0" y="78">50k msg/s per stream</text>
<rect x="428.0" y="68" width="12" height="12" rx="3" class="f-r3"/>
<text class="leg" x="446.0" y="78">200k msg/s per stream</text>
<line class="axis" x1="56" y1="296.0" x2="956" y2="296.0"/>
<text class="tick" x="48" y="300.0" text-anchor="end">0</text>
<line class="grid" x1="56" y1="256.0" x2="956" y2="256.0"/>
<text class="tick" x="48" y="260.0" text-anchor="end">50</text>
