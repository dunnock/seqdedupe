<text class="tick" x="48" y="100.0" text-anchor="end">250</text>
<text class="tick" x="131.0" y="316" text-anchor="middle">WatermarkOnly</text>
<g><title>WatermarkOnly, 10k msg/s per stream: p99 = 50 ns</title><path d="M90.0,296.0 L90.0,260.0 Q90.0,256.0 94.0,256.0 L112.0,256.0 Q116.0,256.0 116.0,260.0 L116.0,296.0 Z" class="f-r1"/></g>
